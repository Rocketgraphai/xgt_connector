# Oracle takes minutes to start and its image is large, and it does not behave
# differently across python or neo4j versions, so running it on every job of the
# PyTest matrix cost far more than it found. It runs here instead, once a night,
# on a single python.
#
# Db2 is not here. Its freely available CLI driver aborts the process when it
# reads a null, so it cannot be tested until a driver built with a 64 bit SQLLEN
# is available.
name: Nightly databases
on:
  schedule:
    # 6 AM UTC, daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 40
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Launch oracle
      # Started first so that it comes up while everything else installs.
      run: |
        docker run --rm -d --name oracle -p1521:1521 -e ORACLE_PASSWORD=test \
            gvenzl/oracle-free:slim

    - name: Install dependencies
      run: |
        sudo apt-get update
        python -m pip install --upgrade pip
        pip install parameterized pyodbc pandas pytest
        pip install './[odbc]'

        # Oracle ships its ODBC driver as a zip rather than a package.
        sudo apt-get install -y libaio1t64 unzip
        sudo mkdir -p /opt/oracle
        cd /opt/oracle
        sudo curl -fsSLO https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
        sudo curl -fsSLO https://download.oracle.com/otn_software/linux/instantclient/instantclient-odbc-linuxx64.zip
        sudo unzip -q instantclient-basiclite-linuxx64.zip
        sudo unzip -q -o instantclient-odbc-linuxx64.zip
        sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
        cd -

    - name: Setup ODBC drivers
      run: |
        # The driver lives at a path carrying a version, so it is looked up
        # rather than written down.
        ORACLE_LIB=$(ls -d /opt/oracle/instantclient_*)
        ORACLE_SO=$(ls $ORACLE_LIB/libsqora.so.*)
        echo -e "[Oracle]\nDescription = Oracle ODBC driver\nDriver = $ORACLE_SO\nFileUsage = 1" | sudo tee -a /etc/odbcinst.ini > /dev/null
        echo "$ORACLE_LIB" | sudo tee /etc/ld.so.conf.d/oracle.conf > /dev/null
        sudo ldconfig
        echo "LD_LIBRARY_PATH=$ORACLE_LIB" >> $GITHUB_ENV
        odbcinst -q -d

    - name: Launch xGT
      run: "docker run --rm -d --name xgt -p 4367:4367 rocketgraph/xgt"

    - name: Wait for oracle
      # Asked for a connection rather than read out of the log, because a
      # database announces itself ready before it will accept one, and a test
      # that cannot connect skips rather than fails.
      env:
        ORACLE: 'Driver={Oracle};DBQ=127.0.0.1:1521/FREEPDB1;UID=system;PWD=test;'
      run: |
        python - <<'PY'
        import os, sys, time, pyodbc
        for name, cs in (('oracle', os.environ['ORACLE']),):
            start = time.time()
            while time.time() - start < 600:
                try:
                    pyodbc.connect(cs, autocommit=True).close()
                    print(f"{name} ready after {time.time() - start:.0f}s")
                    break
                except Exception as e:
                    last = str(e)[:90]
                    time.sleep(10)
            else:
                sys.exit(f"{name} never accepted a connection: {last}")
        PY

    - name: Show docker containers
      run: "docker ps -a"

    - name: Run test suite
      # -rs so that a database dropping out shows up as a reason rather than a dot.
      run: |
        pytest -v -s -rs test/test_odbc_type_matrix.py test/test_odbc_drivers.py
